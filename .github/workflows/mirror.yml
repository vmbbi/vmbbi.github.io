name: Push Mirror to Remote
on:
  push:
    branches: ["master", "maven"]
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: codeberg-tiny
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Target
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "${{ secrets.TARGET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          git remote add target git@github.com:vmbbi/vmbbi.github.io.git || git remote set-url target git@github.com:vmbbi/vmbbi.github.io.git
            
          git push target master refs/remotes/origin/maven:refs/heads/maven --force
          git push target --tags --force