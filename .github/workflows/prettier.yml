name: Prettier Format

on:
  push:
    branches: ["master", "maven"]
  workflow_dispatch:

concurrency:
  group: prettier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci
      - name: Prettier Action
        uses: creyD/prettier_action@v4.6
        with:
          commit_message: "style: auto-format code [skip ci]"
          same_commit: true
          prettier_plugins: "prettier-plugin-astro"
          prettier_options: --write "**/*.{js,jsx,astro,css,json}"
          githeub_token: ${{ secrets.GITHUB_TOKEN }}